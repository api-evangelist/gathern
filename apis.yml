aid: gathern
name: Gathern
description: >-
  Gathern (جاذر) is the first licensed peer-to-peer vacation-rental marketplace
  in Saudi Arabia, founded in Riyadh in 2016 and licensed by the Saudi Ministry
  of Tourism. Through its iOS, Android, and web apps, travelers book short-term
  private accommodations directly from local hosts — chalets, apartments,
  villas, farms, resorts, rest houses (istrahat), camps, caravans, and rooms —
  across more than 200 cities and provinces in the Kingdom, including Riyadh,
  Jeddah, Taif, Al Khobar, Dammam, Mecca, Medina, and AlUla. The platform lists
  tens of thousands of units, has served more than five million users, and holds
  a leading share of the alternative-hospitality sector in Saudi Arabia. Backed
  by 500 Global, STV, Sanabil Investments (a Public Investment Fund subsidiary),
  and others, Gathern raised a $72M Series B and is preparing for a Tadawul
  listing. Gathern operates as a consumer marketplace app and does not currently
  publish a public developer API surface; this profile tracks its public web
  properties for the API Evangelist network.
